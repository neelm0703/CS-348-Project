# Run with: docker compose up --build    → open http://localhost:8080

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published on localhost only, so psql on your Mac can connect (for the
    # isolation demo). Nothing outside this machine can reach it.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    # All app settings (SECRET_KEY, ALLOWED_ORIGINS, ...) come from backend/.env,
    # which is passed in at runtime and never copied into the image.
    env_file: ./backend/.env
    environment:
      # Overrides the SQLite URL in backend/.env. The host is the service name "db".
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      # main.py runs create_all on startup, so Postgres must accept connections first.
      db:
        condition: service_healthy
    # No ports: only reachable from other containers, through the frontend's proxy.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8080:8080"
    depends_on:
      # nginx looks up "backend" when it starts; waiting for healthy also avoids
      # 502s from requests that arrive before the API is up.
      backend:
        condition: service_healthy

volumes:
  pgdata:
